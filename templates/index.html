<html lang="en">
<head>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #07070f;
      --card: #0e0e1a;
      --text: #f0f0f8;
      --sub: #606080;
      --purple: #8a50ff;
      --pink: #c060ff;
      --blue: #60a0ff;
      --radius: 18px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
      overflow-x: hidden;
      cursor: none;
    }

    /* ── CURSOR ── */
    #cur {
      width: 14px; height: 14px;
      background: var(--purple);
      border-radius: 50%;
      position: fixed; pointer-events: none; z-index: 9999;
      transition: transform 0.15s, background 0.15s;
      box-shadow: 0 0 20px var(--purple), 0 0 40px rgba(138,80,255,0.4);
      mix-blend-mode: screen;
    }
    #cur2 {
      width: 40px; height: 40px;
      border: 1.5px solid rgba(138,80,255,0.4);
      border-radius: 50%;
      position: fixed; pointer-events: none; z-index: 9998;
      transition: all 0.25s ease;
    }

    /* ── BG CANVAS ── */
    #bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    /* ── MUSIC PILL ── */
    .mpill {
      position: fixed; top: 18px; right: 18px; z-index: 200;
      display: flex; align-items: center; gap: 10px;
      background: rgba(8,8,18,0.85);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(138,80,255,0.25);
      border-radius: 99px; padding: 9px 18px;
      cursor: pointer;
      transition: border-color 0.3s, box-shadow 0.3s, transform 0.2s;
    }
    .mpill:hover {
      border-color: rgba(138,80,255,0.6);
      box-shadow: 0 0 24px rgba(138,80,255,0.35);
      transform: scale(1.04);
    }
    .mdisk {
      width: 22px; height: 22px; border-radius: 50%;
      background: conic-gradient(#8a50ff, #c060ff, #60a0ff, #8a50ff);
      animation: spin 3s linear infinite;
      box-shadow: 0 0 10px rgba(138,80,255,0.5);
      flex-shrink: 0;
    }
    .mdisk.paused { animation-play-state: paused; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .mbars { display: flex; align-items: flex-end; gap: 2.5px; height: 16px; }
    .mbars span {
      width: 3px; background: var(--purple); border-radius: 2px;
      animation: bbar 0.7s ease-in-out infinite;
    }
    .mbars span:nth-child(2) { animation-delay: 0.1s; }
    .mbars span:nth-child(3) { animation-delay: 0.2s; }
    .mbars span:nth-child(4) { animation-delay: 0.3s; }
    .mbars.paused span { animation-play-state: paused; height: 4px !important; }
    @keyframes bbar { 0%,100%{height:4px} 50%{height:14px} }
    .mlabel { font-size: 10px; font-weight: 800; letter-spacing: 1.5px; color: var(--sub); }

    /* ── PAGE CONTAINER ── */
    .page {
      position: relative; z-index: 1;
      max-width: 500px; margin: 0 auto;
      padding: 70px 20px 90px;
    }

    /* ── PROFILE ── */
    .profile { text-align: center; margin-bottom: 40px; animation: fadeup 0.9s ease both; }

    .av-wrap { display: inline-block; position: relative; margin-bottom: 22px; }
    .av-ring {
      width: 120px; height: 120px; border-radius: 50%;
      padding: 3px;
      background: conic-gradient(from 0deg, #8a50ff, #c060ff, #60a0ff, #ff60c0, #8a50ff);
      animation: ring 4s linear infinite;
    }
    @keyframes ring { to { filter: hue-rotate(360deg); } }
    .av-inner {
      width: 100%; height: 100%; border-radius: 50%;
      background: #07070f;
      display: flex; align-items: center; justify-content: center;
      font-size: 58px; overflow: hidden;
    }
    .av-glow {
      position: absolute; inset: -12px; border-radius: 50%;
      background: radial-gradient(circle, rgba(138,80,255,0.35) 0%, transparent 70%);
      animation: pglow 2.5s ease-in-out infinite; z-index: -1;
    }
    @keyframes pglow { 0%,100%{opacity:.5;transform:scale(1)} 50%{opacity:1;transform:scale(1.12)} }

    .pname {
      font-size: 32px; font-weight: 900;
      background: linear-gradient(90deg, #8a50ff, #c060ff, #60a0ff, #ff60c0, #8a50ff);
      background-size: 300% 100%;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      animation: tflow 4s linear infinite;
      letter-spacing: -1px; margin-bottom: 8px;
    }
    @keyframes tflow { 0%{background-position:0% 50%} 100%{background-position:300% 50%} }

    .pbio {
      font-size: 11px; color: var(--sub);
      letter-spacing: 3px; text-transform: uppercase; font-weight: 700;
    }

    /* mini icons row */
    .micons { display: flex; justify-content: center; gap: 10px; margin-top: 18px; }
    .micons a {
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(138,80,255,0.08);
      border: 1px solid rgba(138,80,255,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; text-decoration: none;
      transition: all 0.25s cubic-bezier(.34,1.56,.64,1);
    }
    .micons a:hover {
      background: rgba(138,80,255,0.22);
      border-color: rgba(138,80,255,0.6);
      transform: translateY(-4px) scale(1.18);
      box-shadow: 0 8px 22px rgba(138,80,255,0.4);
    }

    /* ── DIVIDER ── */
    .div {
      height: 1px; margin: 32px 0;
      background: linear-gradient(90deg, transparent, rgba(138,80,255,0.5), rgba(192,96,255,0.5), transparent);
      background-size: 200%; animation: dflo 3s linear infinite;
    }
    @keyframes dflo { 0%{background-position:0%} 100%{background-position:200%} }

    /* ── LINK CARDS ── */
    .links { display: flex; flex-direction: column; gap: 13px; }

    .lcard {
      display: flex; align-items: center; gap: 16px;
      padding: 18px 20px; border-radius: var(--radius);
      text-decoration: none; color: var(--text);
      border: 1px solid rgba(255,255,255,0.05);
      position: relative; overflow: hidden;
      transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), box-shadow 0.25s;
      animation: fadeup 0.7s ease both;
    }
    .lcard:nth-child(1){animation-delay:.10s}
    .lcard:nth-child(2){animation-delay:.16s}
    .lcard:nth-child(3){animation-delay:.22s}
    .lcard:nth-child(4){animation-delay:.28s}
    .lcard:nth-child(5){animation-delay:.34s}

    @keyframes fadeup { from{opacity:0;transform:translateY(22px)} to{opacity:1;transform:translateY(0)} }

    /* shine on hover */
    .lcard::before {
      content:''; position:absolute; top:0; left:-100%; width:100%; height:100%;
      background: linear-gradient(90deg,transparent,rgba(255,255,255,0.06),transparent);
      transition: left 0.45s ease;
    }
    .lcard:hover::before { left:100%; }

    /* top accent line */
    .lcard::after {
      content:''; position:absolute; top:0; left:0; right:0; height:2px;
      background: var(--accent, linear-gradient(90deg,#8a50ff,#c060ff));
      opacity:0; transition:opacity 0.3s;
    }
    .lcard:hover::after { opacity:1; }
    .lcard:hover { transform: translateY(-5px) scale(1.01); }

    /* platform themes */
    .yt   { background:linear-gradient(135deg,#1a0808 0%,#0e0e1a 100%); --accent:linear-gradient(90deg,#ff3333,#ff7070); }
    .tt   { background:linear-gradient(135deg,#0e0818 0%,#0e0e1a 100%); --accent:linear-gradient(90deg,#8a50ff,#c060ff); }
    .ig   { background:linear-gradient(135deg,#18080e 0%,#0e0e1a 100%); --accent:linear-gradient(90deg,#f09433,#dc2743,#bc1888); }
    .dc   { background:linear-gradient(135deg,#08090e 0%,#0e0e1a 100%); --accent:linear-gradient(90deg,#5865f2,#8891f2); }
    .tg   { background:linear-gradient(135deg,#080e18 0%,#0e0e1a 100%); --accent:linear-gradient(90deg,#26a5e4,#60c8ff); }

    .yt:hover   { box-shadow:0 14px 44px rgba(255,50,50,0.22),  0 0 0 1px rgba(255,50,50,0.18); }
    .tt:hover   { box-shadow:0 14px 44px rgba(138,80,255,0.25), 0 0 0 1px rgba(138,80,255,0.2); }
    .ig:hover   { box-shadow:0 14px 44px rgba(220,39,67,0.22),  0 0 0 1px rgba(220,39,67,0.18); }
    .dc:hover   { box-shadow:0 14px 44px rgba(88,101,242,0.28), 0 0 0 1px rgba(88,101,242,0.22); }
    .tg:hover   { box-shadow:0 14px 44px rgba(38,165,228,0.22), 0 0 0 1px rgba(38,165,228,0.18); }

    .licon {
      width: 50px; height: 50px; border-radius: 14px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; position: relative; z-index: 1;
      transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);

    .lcard:hover .licon { transform: scale(1.2) rotate(-8deg); }

    .yt .licon { background:rgba(255,60,60,0.12); border:1px solid rgba(255,60,60,0.25); }
    .tt .licon { background:rgba(138,80,255,0.12); border:1px solid rgba(138,80,255,0.25); }
    .ig .licon { background:rgba(220,39,67,0.10); border:1px solid rgba(220,39,67,0.22); }
    .dc .licon { background:rgba(88,101,242,0.12); border:1px solid rgba(88,101,242,0.25); }
    .tg .licon { background:rgba(38,165,228,0.12); border:1px solid rgba(38,165,228,0.25); }

    .linfo { flex:1; position:relative; z-index:1; }
    .ltitle { font-size:15px; font-weight:800; margin-bottom:3px; }
    .lsub   { font-size:11px; color:var(--sub); }

    .larr {
      font-size:18px; color:var(--sub); z-index:1; position:relative;
      transition: transform 0.2s, color 0.2s;
    }
    .lcard:hover .larr { transform:translateX(5px); color:var(--text); }

    /* ── FOOTER ── */
    .foot { text-align:center; margin-top:50px; font-size:11px; color:#252535; }
    .foot strong {
      background: linear-gradient(90deg,#8a50ff,#c060ff);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      font-weight:900;
    }

    @media(max-width:480px) { .page{padding:60px 14px 80px;} }
  </style>
</head>

<script>
/* ══════ AURORA BACKGROUND ══════ */
(function(){
  const cv = document.getElementById('bg');
  const cx = cv.getContext('2d');
  let W, H, stars=[], neb=[], shoot=[];

  function resize(){
    W = cv.width  = innerWidth;
    H = cv.height = innerHeight;
    init();
  }

  function init(){
    stars = [];
    const n = Math.floor(W*H/3000);
    for(let i=0;i<n;i++) stars.push({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*1.4+0.2, a:Math.random()*0.8+0.1,
      ts:Math.random()*0.02+0.005, to:Math.random()*Math.PI*2,
      c:['#fff','#c0c0ff','#ffd0ff','#c0e0ff','#ffe0c0'][~~(Math.random()*5)],
    });
    neb = [
      {x:W*.15,y:H*.2, rx:W*.28,ry:H*.22,c1:'rgba(138,50,255,',c2:'rgba(60,0,120,', p:0,   s:.0008},
      {x:W*.8, y:H*.15,rx:W*.25,ry:H*.2, c1:'rgba(60,100,255,',c2:'rgba(0,30,120,', p:1.5, s:.0006},
      {x:W*.5, y:H*.6, rx:W*.35,ry:H*.25,c1:'rgba(200,50,255,',c2:'rgba(80,0,160,', p:3.0, s:.0007},
      {x:W*.1, y:H*.75,rx:W*.2, ry:H*.2, c1:'rgba(50,150,255,',c2:'rgba(0,60,140,', p:.8,  s:.001},
      {x:W*.88,y:H*.7, rx:W*.22,ry:H*.22,c1:'rgba(255,60,160,',c2:'rgba(120,0,80,', p:2.2, s:.0009},
    ];
  }

  function drawNeb(){
    neb.forEach(c=>{
      c.p+=c.s;
      const pulse=.85+.15*Math.sin(c.p);
      const rx=c.rx*pulse,ry=c.ry*(2-pulse);
      const g=cx.createRadialGradient(c.x,c.y,0,c.x,c.y,Math.max(rx,ry));
      g.addColorStop(0,c.c1+'0.12)');g.addColorStop(.4,c.c1+'0.07)');
      g.addColorStop(.7,c.c2+'0.04)');g.addColorStop(1,c.c2+'0)');
      cx.save();cx.scale(1,ry/rx);
      cx.beginPath();cx.arc(c.x,c.y*(rx/ry),rx,0,Math.PI*2);
      cx.fillStyle=g;cx.fill();cx.restore();
    });
  }

  function drawAurora(t){
    [{y:H*.30,amp:H*.06,fr:.0025,sp:.4, c1:'rgba(80,0,180,',  c2:'rgba(0,200,150,', h:H*.18,a:.22},
     {y:H*.38,amp:H*.05,fr:.003, sp:.5, c1:'rgba(140,0,255,', c2:'rgba(0,150,255,', h:H*.14,a:.18},
     {y:H*.25,amp:H*.07,fr:.002, sp:.35,c1:'rgba(200,0,255,', c2:'rgba(60,0,200,',  h:H*.12,a:.15},
     {y:H*.45,amp:H*.04,fr:.004, sp:.6, c1:'rgba(0,180,255,', c2:'rgba(120,0,255,', h:H*.10,a:.12},
    ].forEach(l=>{
      cx.save();cx.beginPath();cx.moveTo(0,H);
      for(let x=0;x<=W;x+=4){
        const w1=Math.sin(x*l.fr+t*l.sp)*l.amp;
        const w2=Math.sin(x*l.fr*1.7+t*l.sp*1.3+1)*l.amp*.4;
        cx.lineTo(x,l.y+w1+w2);
      }
      cx.lineTo(W,H);cx.closePath();
      const g=cx.createLinearGradient(0,l.y-l.amp,0,l.y+l.h);
      g.addColorStop(0,l.c1+'0)');g.addColorStop(.3,l.c1+l.a+')');
      g.addColorStop(.6,l.c2+(l.a*.6)+')');g.addColorStop(1,l.c2+'0)');
      cx.fillStyle=g;cx.fill();cx.restore();
    });
  }

  function drawStars(t){
    stars.forEach(s=>{
      const tw=.4+.6*Math.abs(Math.sin(t*s.ts*60+s.to));
      cx.beginPath();cx.arc(s.x,s.y,s.r,0,Math.PI*2);
      cx.globalAlpha=s.a*tw;cx.fillStyle=s.c;cx.fill();cx.globalAlpha=1;
    });
  }

  function spawnShoot(){
    if(shoot.length<3&&Math.random()<.004) shoot.push({
      x:Math.random()*W*.7,y:Math.random()*H*.4,
      vx:4+Math.random()*5,vy:2+Math.random()*3,
      len:80+Math.random()*120,a:1,fade:.015+Math.random()*.01,
      c:['#fff','#c0c0ff','#ffe0ff'][~~(Math.random()*3)],
    });
  }

  function drawShoot(){
    shoot=shoot.filter(s=>s.a>0);
    shoot.forEach(s=>{
      cx.beginPath();cx.moveTo(s.x,s.y);
      cx.lineTo(s.x-s.vx*(s.len/5),s.y-s.vy*(s.len/5));
      cx.strokeStyle=s.c;cx.lineWidth=1.5;cx.globalAlpha=s.a;cx.stroke();cx.globalAlpha=1;
      s.x+=s.vx;s.y+=s.vy;s.a-=s.fade;
    });
  }

  function loop(){
    const t=Date.now()*.001;
    cx.fillStyle='#07070f';cx.fillRect(0,0,W,H);
    drawNeb();drawAurora(t);drawStars(t);spawnShoot();drawShoot();
    requestAnimationFrame(loop);
  }

  resize();loop();
  addEventListener('resize',resize);
})();

/* ══════ CURSOR ══════ */
const cur  = document.getElementById('cur');
const cur2 = document.getElementById('cur2');
let mx=0,my=0,cx2=0,cy2=0;

document.addEventListener('mousemove',e=>{
  mx=e.clientX;my=e.clientY;
  cur.style.left=mx-7+'px';cur.style.top=my-7+'px';
});

(function trailLoop(){
  cx2+=(mx-cx2)*.12; cy2+=(my-cy2)*.12;
  cur2.style.left=cx2-20+'px'; cur2.style.top=cy2-20+'px';
  requestAnimationFrame(trailLoop);
})();

document.querySelectorAll('a,.mpill').forEach(el=>{
  el.addEventListener('mouseenter',()=>{
    cur.style.transform='scale(2.2)';
    cur.style.background='var(--pink)';
    cur2.style.transform='scale(1.4)';
    cur2.style.borderColor='rgba(192,96,255,0.6)';
  });
  el.addEventListener('mouseleave',()=>{
    cur.style.transform='scale(1)';
    cur.style.background='var(--purple)';
    cur2.style.transform='scale(1)';
    cur2.style.borderColor='rgba(138,80,255,0.4)';

});

/* ══════ MUSIC ══════ */
const aud    = document.getElementById('aud');
const mdisk  = document.getElementById('mdisk');
const mbars  = document.getElementById('mbars');
const mlabel = document.getElementById('mlabel');
let playing  = false;

function toggleMusic(){
  if(playing){
    aud.pause();
    mdisk.classList.add('paused');
    mbars.classList.add('paused');
    mlabel.textContent='PLAY VIBES';
    playing=false;
  } else {
    aud.volume=0.35;
    aud.play().catch(()=>{});
    mdisk.classList.remove('paused');
    mbars.classList.remove('paused');
    mlabel.textContent='VIBES ON ♪';
    playing=true;
  }
}

// Auto-start on first tap/click
document.addEventListener('click', function go(){
  if(!playing) toggleMusic();
  document.removeEventListener('click',go);
},{once:true});

/* ══════ RIPPLE ON CLICK ══════ */
const rippleCSS=document.createElement('style');
rippleCSS.textContent='@keyframes rip{to{transform:scale(2.5);opacity:0}}';
document.head.appendChild(rippleCSS);

document.querySelectorAll('.lcard').forEach(card=>{
  card.addEventListener('click',e=>{
    const r=card.getBoundingClientRect();
    const sz=Math.max(r.width,r.height);
    const dot=document.createElement('span');
    dot.style.cssText=`
      position:absolute;width:${sz}px;height:${sz}px;
      left:${e.clientX-r.left-sz/2}px;top:${e.clientY-r.top-sz/2}px;
      background:rgba(138,80,255,0.18);border-radius:50%;
      transform:scale(0);animation:rip .55s ease-out forwards;
      pointer-events:none;z-index:0;
    `;
    card.appendChild(dot);
    setTimeout(()=>dot.remove(),600);
  });
});

/* ══════ ENTRANCE STAGGER ══════ */
const obs = new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting) e.target.style.animationPlayState='running';
  });
},{threshold:.1});
document.querySelectorAll('.lcard,.profile').forEach(el=>{
  el.style.animationPlayState='paused';
  obs.observe(el);
});
</script>
</body>
</html>
