<html lang="en">
<head>
  <meta charset="UTF-8"/>

  <title>@K1llez</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--pink:#ff2d78;--purple:#c020ff;--white:#fff;--r:14px}
    html,body{width:100%;min-height:100vh;overflow-x:hidden;background:#000}
    body{font-family:'Inter',sans-serif;color:#fff;cursor:none}

    /* ── CURSOR ── */
    #cur{width:8px;height:8px;background:#ff2d78;border-radius:50%;position:fixed;pointer-events:none;z-index:9999;mix-blend-mode:screen;box-shadow:0 0 12px #ff2d78,0 0 24px rgba(255,45,120,.6);transition:transform .1s}
    #cur2{width:28px;height:28px;border:1px solid rgba(255,45,120,.4);border-radius:50%;position:fixed;pointer-events:none;z-index:9998;transition:all .18s}

    /* ── CANVAS BG ── */
    #bg{position:fixed;inset:0;z-index:0;pointer-events:none}

    /* ── CRT OVERLAY ── */
    #crt{
      position:fixed;inset:0;z-index:2;pointer-events:none;
      background:repeating-linear-gradient(
        0deg,
        rgba(0,0,0,.18) 0px,
        rgba(0,0,0,.18) 1px,
        transparent 1px,
        transparent 3px
      );
    }
    /* CRT flicker */
    #crt::after{
      content:'';position:absolute;inset:0;
      background:rgba(255,255,255,.012);
      animation:flicker 4s steps(1) infinite;
    }
    @keyframes flicker{
      0%,95%{opacity:1}
      96%{opacity:.82}
      97%{opacity:1}
      98%{opacity:.9}
      99%{opacity:1}
      99.5%{opacity:.75}
      100%{opacity:1}
    }
    /* CRT vignette */
    #crt::before{
      content:'';position:absolute;inset:0;
      background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.85) 100%);
    }

    /* ── MUSIC PLAYER (Apple-style) ── */
    .player{
      position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:300;
      width:calc(100% - 32px);max-width:440px;
      background:rgba(10,0,8,.88);
      backdrop-filter:blur(40px) saturate(180%);
      -webkit-backdrop-filter:blur(40px) saturate(180%);
      border:1px solid rgba(255,45,120,.18);
      border-radius:22px;
      padding:14px 16px;
      box-shadow:0 8px 40px rgba(255,45,120,.15),0 0 0 1px rgba(255,255,255,.04);
    }
    .player-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
    .pcov{
      width:46px;height:46px;border-radius:10px;flex-shrink:0;overflow:hidden;
      position:relative;
      background:linear-gradient(135deg,#330020,#1a0030);
      border:1px solid rgba(255,45,120,.25);
    }
    .pcov-spin{
      width:100%;height:100%;
      background:conic-gradient(#ff2d78,#c020ff,#ff2d78);
      animation:pspin 4s linear infinite;
      border-radius:10px;
    }
    .pcov-hole{
      position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      width:12px;height:12px;border-radius:50%;background:#0a0008;
      box-shadow:0 0 8px rgba(255,45,120,.5);
    }
    @keyframes pspin{to{transform:rotate(360deg)}}
    .pcov.paused .pcov-spin{animation-play-state:paused}
    .pinfo{flex:1;min-width:0}
    .ptitle{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .partist{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px}
    .pvol{display:flex;align-items:center;gap:6px;margin-top:6px}
    .pvol span{font-size:9px;color:rgba(255,255,255,.25)}
    .pvol-bar{flex:1;height:3px;background:rgba(255,255,255,.1);border-radius:99px;cursor:pointer;position:relative}
    .pvol-fill{height:100%;width:70%;background:linear-gradient(90deg,#ff2d78,#c020ff);border-radius:99px}
    .pctrl{display:flex;align-items:center;justify-content:center;gap:16px}
    .pbtn{background:none;border:none;color:rgba(255,255,255,.6);font-size:13px;cursor:pointer;padding:5px;transition:color .15s,transform .15s;border-radius:50%}
    .pbtn:hover{color:#fff;transform:scale(1.1)}
    .pbtn.play{
      width:40px;height:40px;border-radius:50%;
      background:linear-gradient(135deg,#ff2d78,#c020ff);
      color:#fff;font-size:16px;
      box-shadow:0 0 20px rgba(255,45,120,.5);
      display:flex;align-items:center;justify-content:center;
    }
    .pbtn.play:hover{box-shadow:0 0 32px rgba(255,45,120,.8);transform:scale(1.06)}
    .pbar{margin-top:10px;cursor:pointer}
    .pbar-track{height:3px;background:rgba(255,255,255,.08);border-radius:99px;position:relative}
    .pbar-fill{height:100%;width:0%;background:linear-gradient(90deg,#ff2d78,#c020ff);border-radius:99px;transition:width .6s linear;position:relative}
    .pbar-fill::after{content:'';position:absolute;right:-4px;top:-3px;width:9px;height:9px;background:#fff;border-radius:50%;box-shadow:0 0 8px rgba(255,45,120,.8)}
    .ptime{display:flex;justify-content:space-between;margin-top:5px;font-size:9px;color:rgba(255,255,255,.25)}
    .pviz{display:flex;align-items:flex-end;gap:2px;height:14px}
    .pviz span{width:2.5px;background:linear-gradient(to top,#ff2d78,#c020ff);border-radius:2px;animation:pvb .65s ease-in-out infinite;box-shadow:0 0 4px rgba(255,45,120,.5)}
    .pviz span:nth-child(2){animation-delay:.1s}.pviz span:nth-child(3){animation-delay:.2s}.pviz span:nth-child(4){animation-delay:.3s}.pviz span:nth-child(5){animation-delay:.15s}
    .pviz.paused span{animation-play-state:paused;height:2px!important}
    @keyframes pvb{0%,100%{height:2px}50%{height:12px}}

    /* ── PAGE ── */
    .page{position:relative;z-index:3;max-width:460px;margin:0 auto;padding:52px 16px 130px}

    /* ── PROFILE ── */
    .profile{text-align:center;margin-bottom:36px}
    .av-wrap{display:inline-block;position:relative;margin-bottom:20px}
    /* chromatic aberration ring */
    .av-ring{
      width:112px;height:112px;border-radius:50%;padding:3px;
      background:conic-gradient(#ff2d78,#c020ff,#00ffff,#ff2d78);
      animation:ringspin 6s linear infinite;
      filter:drop-shadow(0 0 20px #ff2d78) drop-shadow(0 0 40px rgba(192,32,255,.5));
    }
    @keyframes ringspin{to{filter:drop-shadow(0 0 20px #ff2d78) drop-shadow(0 0 40px rgba(192,32,255,.5)) hue-rotate(360deg)}}
    .av-inner{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#000;position:relative}
    .av-inner img{width:100%;height:100%;object-fit:cover}
    /* chromatic glitch on avatar */
    .av-inner::after{
      content:'';position:absolute;inset:0;border-radius:50%;
      background:linear-gradient(135deg,rgba(255,45,120,.08),rgba(192,32,255,.08));
      mix-blend-mode:screen;
      animation:avglitch 5s steps(1) infinite;
    }
    @keyframes avglitch{
      0%,88%{transform:translate(0,0);opacity:0}
      89%{transform:translate(-2px,0);opacity:.5;filter:hue-rotate(90deg)}
      90%{transform:translate(2px,0);opacity:.5;filter:hue-rotate(-90deg)}
      91%,100%{transform:translate(0,0);opacity:0}
    }
    .av-glow{position:absolute;inset:-18px;border-radius:50%;z-index:-1;background:radial-gradient(circle,rgba(255,45,120,.4) 0%,rgba(192,32,255,.2) 40%,transparent 65%);animation:pglow 2.5s ease-in-out infinite}
    @keyframes pglow{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.12);opacity:1}}

    /* 3D glitch name */
    .pname{
      font-size:32px;font-weight:900;letter-spacing:1px;
      color:#fff;
      position:relative;display:inline-block;
      text-transform:uppercase;
      margin-bottom:6px;
      /* 3D layered text shadow */
      text-shadow:
        0 1px 0 rgba(255,45,120,.8),
        0 2px 0 rgba(255,45,120,.6),
        0 3px 0 rgba(255,45,120,.4),
        0 4px 0 rgba(192,32,255,.3),
        0 5px 0 rgba(192,32,255,.2),
        0 6px 10px rgba(255,45,120,.5),
        0 0 30px rgba(255,45,120,.6),
        0 0 60px rgba(192,32,255,.3),
        /* chromatic aberration */
        -2px 0 rgba(0,255,255,.25),
        2px 0 rgba(255,45,120,.25);
      animation:nameglitch 7s steps(1) infinite;
    }
    @keyframes nameglitch{
      0%,92%{text-shadow:0 1px 0 rgba(255,45,120,.8),0 2px 0 rgba(255,45,120,.6),0 3px 0 rgba(255,45,120,.4),0 4px 0 rgba(192,32,255,.3),0 5px 0 rgba(192,32,255,.2),0 6px 10px rgba(255,45,120,.5),0 0 30px rgba(255,45,120,.6),0 0 60px rgba(192,32,255,.3),-2px 0 rgba(0,255,255,.25),2px 0 rgba(255,45,120,.25)}
      93%{text-shadow:3px 0 rgba(0,255,255,.7),-3px 0 rgba(255,45,120,.7),0 0 20px rgba(255,45,120,.9);transform:translate(-2px,0)}
      94%{text-shadow:-3px 0 rgba(0,255,255,.7),3px 0 rgba(192,32,255,.7),0 0 20px rgba(192,32,255,.9);transform:translate(2px,0)}
      95%,100%{text-shadow:0 1px 0 rgba(255,45,120,.8),0 2px 0 rgba(255,45,120,.6),0 3px 0 rgba(255,45,120,.4),0 4px 0 rgba(192,32,255,.3),0 5px 0 rgba(192,32,255,.2),0 6px 10px rgba(255,45,120,.5),0 0 30px rgba(255,45,120,.6),0 0 60px rgba(192,32,255,.3),-2px 0 rgba(0,255,255,.25),2px 0 rgba(255,45,120,.25);transform:translate(0,0)}
    }
    .pbio{
      font-size:9px;letter-spacing:4px;text-transform:uppercase;
      color:rgba(255,255,255,.3);font-weight:600;
      text-shadow:0 0 10px rgba(255,45,120,.3);
    }
    .sstrip{display:flex;justify-content:center;gap:8px;margin-top:16px}
    .sstrip a{
      width:30px;height:30px;border-radius:50%;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      display:flex;align-items:center;justify-content:center;
      font-size:12px;text-decoration:none;
      transition:all .2s cubic-bezier(.34,1.56,.64,1);
      backdrop-filter:blur(10px);
    }
    .sstrip a:hover{background:rgba(255,45,120,.15);border-color:rgba(255,45,120,.5);transform:translateY(-3px) scale(1.15);box-shadow:0 4px 16px rgba(255,45,120,.4)}

    /* ── DIVIDER ── */
    .div{
      height:1px;margin:24px 0;
      background:linear-gradient(90deg,transparent,rgba(255,45,120,.4),rgba(192,32,255,.4),transparent);
      background-size:200%;animation:dflo 3s linear infinite;
    }
    @keyframes dflo{0%{background-position:0%}100%{background-position:200%}}

    /* ── CARDS ── */
    .links{display:flex;flex-direction:column;gap:10px}
    .lcard{
      display:flex;align-items:center;gap:14px;
      padding:14px 16px;border-radius:var(--r);
      text-decoration:none;color:#fff;
      position:relative;overflow:hidden;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.09);
      backdrop-filter:blur(20px);
      transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .22s,background .22s;
      animation:fup .5s ease both;
    }
    @keyframes fup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .lcard:nth-child(1){animation-delay:.06s}.lcard:nth-child(2){animation-delay:.12s}.lcard:nth-child(3){animation-delay:.18s}.lcard:nth-child(4){animation-delay:.24s}.lcard:nth-child(5){animation-delay:.30s}

    /* shimmer */
    .lcard::before{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);transition:left .4s ease;transform:skewX(-10deg)}
    .lcard:hover::before{left:140%}
    /* neon top line */
    .lcard::after{content:'';position:absolute;top:0;left:0;right:0;height:1.5px;background:var(--acc,linear-gradient(90deg,#ff2d78,#c020ff));opacity:0;transition:opacity .2s;border-radius:var(--r) var(--r) 0 0}
    .lcard:hover::after{opacity:1}
    .lcard:hover{transform:translateY(-3px) scale(1.005)}

    .yt{--acc:linear-gradient(90deg,#ff0000,#ff6060)}.yt:hover{box-shadow:0 8px 30px rgba(255,0,0,.3),inset 0 0 0 1px rgba(255,0,0,.2);background:rgba(255,0,0,.07)!important}
    .tt{--acc:linear-gradient(90deg,#ee1d52,#69c9d0)}.tt:hover{box-shadow:0 8px 30px rgba(238,29,82,.25),inset 0 0 0 1px rgba(238,29,82,.2);background:rgba(238,29,82,.07)!important}
    .ig{--acc:linear-gradient(90deg,#f09433,#dc2743,#bc1888)}.ig:hover{box-shadow:0 8px 30px rgba(220,39,67,.25),inset 0 0 0 1px rgba(220,39,67,.2);background:rgba(220,39,67,.07)!important}
    .dc{--acc:linear-gradient(90deg,#5865f2,#8891f2)}.dc:hover{box-shadow:0 8px 30px rgba(88,101,242,.3),inset 0 0 0 1px rgba(88,101,242,.22);background:rgba(88,101,242,.07)!important}
    .tg{--acc:linear-gradient(90deg,#26a5e4,#60c8ff)}.tg:hover{box-shadow:0 8px 30px rgba(38,165,228,.25),inset 0 0 0 1px rgba(38,165,228,.2);background:rgba(38,165,228,.07)!important}

    .licon{width:44px;height:44px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
    .lcard:hover .licon{transform:scale(1.15) rotate(-5deg)}
    .yt .licon{background:rgba(255,0,0,.1);border:1px solid rgba(255,0,0,.25)}
    .tt .licon{background:rgba(238,29,82,.08);border:1px solid rgba(238,29,82,.22)}
    .ig .licon{background:rgba(220,39,67,.08);border:1px solid rgba(220,39,67,.22)}
    .dc .licon{background:rgba(88,101,242,.1);border:1px solid rgba(88,101,242,.25)}
    .tg .licon{background:rgba(38,165,228,.08);border:1px solid rgba(38,165,228,.22)}
    .licon svg{width:22px;height:22px}

    .linfo{flex:1;z-index:1;min-width:0}
    /* 3D card title text */
    .ltitle{
      font-size:13px;font-weight:800;margin-bottom:2px;
      text-shadow:0 1px 0 rgba(255,255,255,.3),0 2px 4px rgba(0,0,0,.5);
    }
    .lsub{font-size:10px;color:rgba(255,255,255,.35);letter-spacing:.3px}
    .larr{font-size:13px;color:rgba(255,255,255,.15);z-index:1;transition:transform .18s,color .18s}
    .lcard:hover .larr{transform:translateX(4px);color:rgba(255,255,255,.5)}

    /* ── FOOTER ── */
    .foot{text-align:center;margin-top:32px;font-size:9px;color:rgba(255,255,255,.1);letter-spacing:2px;text-transform:uppercase}

    @media(max-width:480px){.page{padding:44px 12px 130px}.player{bottom:12px;border-radius:18px}}
  </style>
</head>

<script>
/* ════════════════════════════
   CRT NEON BACKGROUND
   Pure black + overexposed pink/purple blobs + chromatic scan
════════════════════════════ */
(function(){
  const cv=document.getElementById('bg');
  const cx=cv.getContext('2d');
  let W,H,t=0;

  const blobs=[
    {ox:.5, oy:.25, pr:.38, speed:.0009, hue:330, phase:0},
    {ox:.15, oy:.5,  pr:.28, speed:.0012, hue:280, phase:2.1},
    {ox:.85, oy:.6,  pr:.32, speed:.0008, hue:310, phase:4.2},
    {ox:.5,  oy:.82, pr:.30, speed:.001,  hue:340, phase:1.5},
    {ox:.3,  oy:.15, pr:.22, speed:.0014, hue:260, phase:3.3},
  ];

  function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}

  function drawBg(){
    cx.fillStyle='#000';cx.fillRect(0,0,W,H);
  }

  function drawBlobs(ts){
    blobs.forEach(b=>{
      b.phase+=b.speed;
      const px=b.ox*W + Math.sin(b.phase*.7)*W*.06;
      const py=b.oy*H + Math.cos(b.phase*.5)*H*.07;
      const r=b.pr*Math.min(W,H)*(1+.08*Math.sin(b.phase*1.4));

      // Core overexposed white-hot center
      const gc=cx.createRadialGradient(px,py,0,px,py,r);
      gc.addColorStop(0,`hsla(${b.hue},100%,95%,.55)`);
      gc.addColorStop(.15,`hsla(${b.hue},100%,70%,.35)`);
      gc.addColorStop(.4,`hsla(${b.hue},100%,50%,.18)`);
      gc.addColorStop(.7,`hsla(${b.hue},80%,30%,.08)`);
      gc.addColorStop(1,'transparent');
      cx.beginPath();cx.arc(px,py,r,0,Math.PI*2);
      cx.fillStyle=gc;cx.fill();

      // Chromatic aberration — red channel offset
      const gr=cx.createRadialGradient(px+8,py,0,px+8,py,r*.8);
      gr.addColorStop(0,'rgba(255,0,100,.12)');
      gr.addColorStop(.5,'rgba(255,0,80,.05)');
      gr.addColorStop(1,'transparent');
      cx.beginPath();cx.arc(px+8,py,r*.8,0,Math.PI*2);
      cx.fillStyle=gr;cx.fill();

      // Cyan channel offset
      const gcy=cx.createRadialGradient(px-6,py+3,0,px-6,py+3,r*.7);
      gcy.addColorStop(0,'rgba(0,255,255,.07)');
      gcy.addColorStop(.5,'rgba(0,200,255,.03)');
      gcy.addColorStop(1,'transparent');
      cx.beginPath();cx.arc(px-6,py+3,r*.7,0,Math.PI*2);
      cx.fillStyle=gcy;cx.fill();
    });
  }

  function drawNoise(){
    // Random pixel noise for CRT feel
    const id=cx.createImageData(W,H);
    const d=id.data;
    for(let i=0;i<d.length;i+=16){
      const v=Math.random()*12|0;
      d[i]=d[i+1]=d[i+2]=v;
      d[i+3]=18;
    }
    cx.putImageData(id,0,0);
  }

  function loop(){
    t++;
    drawBg();
    drawBlobs(t);
    if(t%3===0)drawNoise(); // noise every 3 frames for perf
    requestAnimationFrame(loop);
  }
  resize();loop();
  addEventListener('resize',resize);
})();

/* ════════════════════════════
   CURSOR
════════════════════════════ */
const cur=document.getElementById('cur');
const cur2=document.getElementById('cur2');
let mx=0,my=0,tx=0,ty=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cur.style.left=mx-4+'px';cur.style.top=my-4+'px'});
(function tl(){tx+=(mx-tx)*.1;ty+=(my-ty)*.1;cur2.style.left=tx-14+'px';cur2.style.top=ty-14+'px';requestAnimationFrame(tl)})();
document.querySelectorAll('a,.pbtn,.player').forEach(el=>{
  el.addEventListener('mouseenter',()=>{cur.style.transform='scale(2.5)';cur2.style.transform='scale(1.3)';cur2.style.borderColor='rgba(255,45,120,.6)'});
  el.addEventListener('mouseleave',()=>{cur.style.transform='scale(1)';cur2.style.transform='scale(1)';cur2.style.borderColor='rgba(255,45,120,.4)'});
});

/* ════════════════════════════
   MUSIC (Web Audio API for CORS-safe playback)
════════════════════════════ */
const tracks=[
  {title:'Night Drive',   artist:'Phonk Era',   src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3'},
  {title:'Dark Ritual',   artist:'K1llez Mix',  src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3'},
  {title:'Lost Signal',   artist:'Lofi Ghost',  src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'},
];
let ci=0,playing=false;
const aud=document.getElementById('aud');
const playbtn=document.getElementById('playbtn');
const pviz=document.getElementById('pviz');
const pcov=document.getElementById('pcov');

function fmt(s){const m=Math.floor(s/60),ss=Math.floor(s%60);return m+':'+(ss<10?'0':'')+ss}

function loadTrack(i){
  ci=(i+tracks.length)%tracks.length;
  document.getElementById('ptitle').textContent=tracks[ci].title;
  document.getElementById('partist').textContent=tracks[ci].artist;
  document.getElementById('pbarfill').style.width='0%';
  document.getElementById('ptime-c').textContent='0:00';
  document.getElementById('ptime-t').textContent='0:00';
  aud.src=tracks[ci].src;
  aud.load();
  if(playing)aud.play().catch(()=>{});
}

function togglePlay(){
  if(playing){
    aud.pause();playing=false;
    playbtn.textContent='▶';
    pviz.classList.add('paused');
    pcov.classList.add('paused');
  } else {
    aud.volume=.4;
    aud.play().then(()=>{
      playing=true;
      playbtn.textContent='⏸';
      pviz.classList.remove('paused');
      pcov.classList.remove('paused');
    }).catch(e=>{
      console.log('autoplay blocked:',e);
      // Still update state for retry
      playing=true;
      playbtn.textContent='⏸';
      pviz.classList.remove('paused');
      pcov.classList.remove('paused');
    });
  }
}

function prevT(){loadTrack(ci-1)}
function nextT(){loadTrack(ci+1)}

function seek(e){
  if(!aud.duration)return;
  const r=document.querySelector('.pbar-track').getBoundingClientRect();
  aud.currentTime=((e.clientX-r.left)/r.width)*aud.duration;
}

aud.addEventListener('timeupdate',()=>{
  if(!aud.duration)return;
  const p=aud.currentTime/aud.duration*100;
  document.getElementById('pbarfill').style.width=p+'%';
  document.getElementById('ptime-c').textContent=fmt(aud.currentTime);
  document.getElementById('ptime-t').textContent=fmt(aud.duration);
});
aud.addEventListener('ended',()=>nextT());
aud.addEventListener('error',()=>{
  document.getElementById('ptitle').textContent='⚠ Audio unavailable';
  setTimeout(()=>nextT(),2000);
});

loadTrack(0);

// Auto-start on FIRST user interaction (required by browsers)
function startOnInteract(){
  if(!playing){
    aud.volume=.4;
    aud.play().then(()=>{
      playing=true;
      playbtn.textContent='⏸';
      pviz.classList.remove('paused');
      pcov.classList.remove('paused');
    }).catch(()=>{});
  }
  document.removeEventListener('click',startOnInteract);
  document.removeEventListener('touchstart',startOnInteract);
  document.removeEventListener('keydown',startOnInteract);
}
document.addEventListener('click',startOnInteract,{once:true});
document.addEventListener('touchstart',startOnInteract,{once:true,passive:true});
document.addEventListener('keydown',startOnInteract,{once:true});

/* ════════════════════════════
   RIPPLE
════════════════════════════ */
const rs=document.createElement('style');
rs.textContent='@keyframes rip{to{transform:scale(3);opacity:0}}';
document.head.appendChild(rs);
document.querySelectorAll('.lcard').forEach(c=>{
  c.addEventListener('click',e=>{
    const r=c.getBoundingClientRect(),sz=Math.max(r.width,r.height);
    const d=document.createElement('span');
    d.style.cssText=`position:absolute;width:${sz}px;height:${sz}px;left:${e.clientX-r.left-sz/2}px;top:${e.clientY-r.top-sz/2}px;background:rgba(255,45,120,.1);border-radius:50%;transform:scale(0);animation:rip .5s ease-out forwards;pointer-events:none;z-index:0`;
    c.appendChild(d);setTimeout(()=>d.remove(),520);
  });
});
</script>
