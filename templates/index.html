<html lang="en">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#050508;
      --red:#ff1a1a;
      --red2:#cc0000;
      --dark-red:#1a0000;
      --text:#f5f0f0;
      --sub:#806060;
      --r:18px;
    }
    html,body{width:100%;min-height:100vh;overflow-x:hidden}
    body{
      font-family:'Inter',sans-serif;
      background:var(--bg);
      color:var(--text);
      cursor:none;
    }

    /* ─── CUSTOM CURSOR ─── */
    #cur{
      width:12px;height:12px;
      background:#ff1a1a;
      border-radius:50%;
      position:fixed;pointer-events:none;z-index:9999;
      box-shadow:0 0 18px #ff1a1a,0 0 40px rgba(255,26,26,0.5);
      transition:transform .12s,background .15s;
      mix-blend-mode:screen;
    }
    #cur2{
      width:36px;height:36px;
      border:1.5px solid rgba(255,26,26,0.35);
      border-radius:50%;
      position:fixed;pointer-events:none;z-index:9998;
      transition:all .22s ease;
    }

    /* ─── CANVAS BG ─── */
    #bg{position:fixed;inset:0;z-index:0;pointer-events:none}

    /* ─── MUSIC BAR ─── */
    .mbar{
      position:fixed;bottom:0;left:0;right:0;z-index:300;
      background:rgba(8,0,0,0.92);
      backdrop-filter:blur(28px);
      border-top:1px solid rgba(255,26,26,0.18);
      padding:10px 20px;
      display:flex;align-items:center;gap:14px;
    }
    .mcover{
      width:44px;height:44px;border-radius:10px;flex-shrink:0;
      background:linear-gradient(135deg,#3a0000,#1a0000);
      border:1px solid rgba(255,26,26,0.3);
      display:flex;align-items:center;justify-content:center;
      font-size:22px;
      position:relative;overflow:hidden;
    }
    .mcover::after{
      content:'';position:absolute;inset:0;
      background:conic-gradient(rgba(255,26,26,0.3),transparent,rgba(255,26,26,0.3));
      animation:cspin 3s linear infinite;
    }
    @keyframes cspin{to{transform:rotate(360deg)}}
    .minfo{flex:1;min-width:0}
    .msong{font-size:12px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .martist{font-size:10px;color:var(--sub);margin-top:2px}
    .mprog{
      height:3px;background:rgba(255,255,255,0.06);border-radius:99px;
      margin-top:7px;cursor:pointer;
    }
    .mprogfill{
      height:100%;width:0%;border-radius:99px;
      background:linear-gradient(90deg,#ff1a1a,#ff6060);
      transition:width .8s linear;
    }
    .mbtns{display:flex;align-items:center;gap:10px;flex-shrink:0}
    .mbtn{
      width:36px;height:36px;border-radius:50%;border:none;
      background:rgba(255,26,26,0.08);
      color:var(--text);font-size:15px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:all .2s;
      border:1px solid rgba(255,26,26,0.15);
    }
    .mbtn:hover{background:rgba(255,26,26,0.22);box-shadow:0 0 16px rgba(255,26,26,0.4);transform:scale(1.1)}
    .mbtn.play{
      width:42px;height:42px;font-size:18px;
      background:linear-gradient(135deg,#cc0000,#ff1a1a);
      box-shadow:0 0 20px rgba(255,26,26,0.5);
      border:none;
    }
    .mbtn.play:hover{box-shadow:0 0 32px rgba(255,26,26,0.7)}
    .mviz{display:flex;align-items:flex-end;gap:2px;height:18px;flex-shrink:0}
    .mviz span{
      width:3px;background:#ff1a1a;border-radius:2px;
      animation:vbar .6s ease-in-out infinite;
      box-shadow:0 0 6px rgba(255,26,26,0.6);
    }
    .mviz span:nth-child(2){animation-delay:.1s}
    .mviz span:nth-child(3){animation-delay:.2s}
    .mviz span:nth-child(4){animation-delay:.3s}
    .mviz span:nth-child(5){animation-delay:.15s}
    .mviz.paused span{animation-play-state:paused;height:3px!important}
    @keyframes vbar{0%,100%{height:3px}50%{height:16px}}

    /* ─── PAGE ─── */
    .page{
      position:relative;z-index:1;
      max-width:480px;margin:0 auto;
      padding:60px 18px 110px;
    }

    /* ─── PROFILE ─── */
    .profile{text-align:center;margin-bottom:36px;animation:fup .8s ease both}

    .av-wrap{
      display:inline-block;position:relative;
      margin-bottom:20px;
    }
    .av-ring{
      width:110px;height:110px;border-radius:50%;
      padding:3px;
      background:conic-gradient(from 0deg,#ff1a1a,#660000,#ff1a1a,#cc0000,#ff1a1a);
      animation:rspin 5s linear infinite;
      filter:drop-shadow(0 0 18px rgba(255,26,26,0.6));
    }
    @keyframes rspin{to{filter:drop-shadow(0 0 18px rgba(255,26,26,0.6)) hue-rotate(40deg)}}
    .av-inner{
      width:100%;height:100%;border-radius:50%;
      background:#0d0000;overflow:hidden;
      display:flex;align-items:center;justify-content:center;
    }
    .av-inner img{width:100%;height:100%;object-fit:cover}
    .av-glow{
      position:absolute;inset:-16px;border-radius:50%;z-index:-1;
      background:radial-gradient(circle,rgba(255,26,26,0.4) 0%,transparent 65%);
      animation:pglow 2.5s ease-in-out infinite;
    }
    @keyframes pglow{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}

    .pname{
      font-size:30px;font-weight:900;letter-spacing:-0.5px;
      background:linear-gradient(90deg,#ff6060,#ff1a1a,#cc0000,#ff4444,#ff6060);
      background-size:300% 100%;
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      animation:tflow 4s linear infinite;
      margin-bottom:6px;
    }
    @keyframes tflow{0%{background-position:0% 50%}100%{background-position:300% 50%}}
    .pbio{
      font-size:10px;letter-spacing:3.5px;text-transform:uppercase;
      color:var(--sub);font-weight:700;
    }

    /* mini social strip */
    .sstrip{display:flex;justify-content:center;gap:8px;margin-top:16px}
    .sstrip a{
      width:32px;height:32px;border-radius:50%;
      background:rgba(255,26,26,0.07);
      border:1px solid rgba(255,26,26,0.18);
      display:flex;align-items:center;justify-content:center;
      font-size:14px;text-decoration:none;
      transition:all .25s cubic-bezier(.34,1.56,.64,1);

    .sstrip a:hover{
      background:rgba(255,26,26,0.2);
      border-color:rgba(255,26,26,0.6);
      transform:translateY(-4px) scale(1.15);

    }

    /* ─── DIVIDER ─── */
    .div{

      background:linear-gradient(90deg,transparent,rgba(255,26,26,0.5),rgba(200,0,0,0.5),transparent);

    @keyframes dflo{0%{background-position:0%}100%{background-position:200%}}

    /* ─── LINK CARDS ─── */
    .links{display:flex;flex-direction:column;gap:12px}

    .lcard{
      display:flex;align-items:center;gap:14px;
      padding:16px 18px;border-radius:var(--r);
      text-decoration:none;color:var(--text);
      position:relative;overflow:hidden;
      border:1px solid rgba(255,26,26,0.08);
      background:rgba(20,0,0,0.6);
      backdrop-filter:blur(12px);
      transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s;
      animation:fup .6s ease both;
    }
    .lcard:nth-child(1){animation-delay:.08s}
    .lcard:nth-child(2){animation-delay:.14s}
    .lcard:nth-child(3){animation-delay:.20s}
    .lcard:nth-child(4){animation-delay:.26s}
    .lcard:nth-child(5){animation-delay:.32s}

    @keyframes fup{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

    /* shimmer */
    .lcard::before{
      content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
      background:linear-gradient(90deg,transparent,rgba(255,50,50,0.07),transparent);
      transition:left .4s ease;
    }
    .lcard:hover::before{left:100%}
    /* top line */
    .lcard::after{
      content:'';position:absolute;top:0;left:0;right:0;height:2px;
      background:var(--acc,linear-gradient(90deg,#ff1a1a,#cc0000));
      opacity:0;transition:opacity .25s;
    }
    .lcard:hover::after{opacity:1}
    .lcard:hover{transform:translateY(-5px) scale(1.01)}

    /* per-platform */
    .yt {--acc:linear-gradient(90deg,#ff0000,#ff6060);background:linear-gradient(135deg,rgba(30,0,0,.7),rgba(14,0,0,.9))}
    .tt {--acc:linear-gradient(90deg,#ee1d52,#69c9d0);background:linear-gradient(135deg,rgba(20,0,10,.7),rgba(14,0,0,.9))}

    .tg {--acc:linear-gradient(90deg,#26a5e4,#60c8ff);background:linear-gradient(135deg,rgba(0,8,20,.7),rgba(14,0,0,.9))}

    .yt:hover{box-shadow:0 12px 40px rgba(255,0,0,.25),0 0 0 1px rgba(255,0,0,.15)}

    .tg:hover{box-shadow:0 12px 40px rgba(38,165,228,.22),0 0 0 1px rgba(38,165,228,.15)}

    .licon{
      width:48px;height:48px;border-radius:12px;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;font-size:24px;
      position:relative;z-index:1;
      transition:transform .3s cubic-bezier(.34,1.56,.64,1);
      background:rgba(255,26,26,0.07);border:1px solid rgba(255,26,26,0.15);

    .lcard:hover .licon{transform:scale(1.18) rotate(-7deg)}
    .linfo{flex:1;z-index:1;min-width:0}
    .ltitle{font-size:14px;font-weight:800;margin-bottom:2px}
    .lsub{font-size:11px;color:var(--sub)}
    .larr{font-size:16px;color:rgba(255,26,26,0.4);z-index:1;transition:transform .2s,color .2s}
    .lcard:hover .larr{transform:translateX(5px);color:rgba(255,80,80,0.8)}

    /* ─── FOOTER ─── */
    .foot{text-align:center;margin-top:42px;font-size:10px;color:#2a1010}
    .foot strong{
      background:linear-gradient(90deg,#ff1a1a,#cc0000);

      font-weight:900;
    }

    @media(max-width:480px){.page{padding:50px 12px 110px}.mbar{padding:8px 14px}}
  </style>

<script>
/* ═══════════════════════════════
   ABSTRACT RED BLOB BACKGROUND
 */
(function(){
  const cv=document.getElementById('bg');
  const ctx=cv.getContext('2d');
  let W,H,blobs=[],particles=[];

  function resize(){
    W=cv.width=innerWidth;
    H=cv.height=innerHeight;
    initBlobs();
  }

  function initBlobs(){
    blobs=[
      {x:W*.15,y:H*.2, r:W*.32,vx:.18,vy:.12,c1:'rgba(180,0,0,',c2:'rgba(80,0,0,',  p:0,   ps:.006},
      {x:W*.8, y:H*.35,r:W*.28,vx:-.14,vy:.16,c1:'rgba(220,0,20,',c2:'rgba(100,0,0,',p:1.8, ps:.005},
      {x:W*.5, y:H*.7, r:W*.36,vx:.10,vy:-.12,c1:'rgba(150,0,0,', c2:'rgba(60,0,0,', p:3.2, ps:.007},
      {x:W*.1, y:H*.8, r:W*.22,vx:.20,vy:-.08,c1:'rgba(200,10,0,',c2:'rgba(90,0,0,', p:.9,  ps:.004},
      {x:W*.9, y:H*.75,r:W*.25,vx:-.18,vy:.10,c1:'rgba(160,0,30,',c2:'rgba(70,0,20,',p:2.5, ps:.006},
    ];
    particles=[];
    for(let i=0;i<60;i++) particles.push({
      x:Math.random()*W, y:Math.random()*H,
      vx:(Math.random()-.5)*.4, vy:(Math.random()-.5)*.4,
      r:Math.random()*2+.5,
      a:Math.random()*.6+.1,
      c:Math.random()<.7?'255,26,26':'200,80,80',
    });
  }

  function drawBlobs(t){
    blobs.forEach(b=>{
      b.p+=b.ps;
      const ox=Math.sin(b.p*.7)*W*.06;
      const oy=Math.cos(b.p*.5)*H*.07;
      const pulse=.88+.12*Math.sin(b.p*1.3);
      const r=b.r*pulse;
      const x=b.x+ox, y=b.y+oy;
      const g=ctx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,b.c1+'0.18)');
      g.addColorStop(.45,b.c1+'0.09)');
      g.addColorStop(.75,b.c2+'0.04)');
      g.addColorStop(1,b.c2+'0)');
      ctx.beginPath();
      // organic blob shape
      ctx.save();
      ctx.translate(x,y);
      const pts=8;
      ctx.beginPath();
      for(let i=0;i<=pts;i++){
        const angle=(i/pts)*Math.PI*2;
        const wobble=1+.15*Math.sin(b.p+i*1.3);
        const rx=r*wobble*(1+.08*Math.sin(b.p*1.7+i));
        const ry=r*wobble*(1+.08*Math.cos(b.p*1.4+i));
        const px=Math.cos(angle)*rx;
        const py=Math.sin(angle)*ry;
        i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
      }
      ctx.closePath();
      ctx.fillStyle=g;ctx.fill();
      ctx.restore();
    });
  }

  function drawGrid(t){
    ctx.save();
    ctx.strokeStyle='rgba(255,26,26,0.025)';
    ctx.lineWidth=.8;
    const gs=60;
    const offX=(t*8)%gs, offY=(t*5)%gs;
    for(let x=-gs+offX;x<W+gs;x+=gs){
      ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
    }
    for(let y=-gs+offY;y<H+gs;y+=gs){
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
    }
    ctx.restore();
  }

  function drawParticles(){
    particles.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;
      if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(${p.c},${p.a})`;
      ctx.shadowColor=`rgba(${p.c},0.6)`;
      ctx.shadowBlur=6;
      ctx.fill();
      ctx.shadowBlur=0;
    });
  }

  function drawVignette(){
    const g=ctx.createRadialGradient(W/2,H/2,H*.1,W/2,H/2,H*.9);
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(1,'rgba(0,0,0,0.75)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }

  function loop(){
    const t=Date.now()*.001;
    ctx.fillStyle='#050508';ctx.fillRect(0,0,W,H);
    drawGrid(t);
    drawBlobs(t);
    drawParticles();
    drawVignette();
    requestAnimationFrame(loop);
  }

  resize();loop();
  addEventListener('resize',resize);
})();

/* ═══════════════════════════════
   CUSTOM CURSOR
 */
const cur=document.getElementById('cur');
const cur2=document.getElementById('cur2');
let mx=0,my=0,tx=0,ty=0;
document.addEventListener('mousemove',e=>{
  mx=e.clientX;my=e.clientY;
  cur.style.left=mx-6+'px';cur.style.top=my-6+'px';
});
(function t(){
  tx+=(mx-tx)*.1;ty+=(my-ty)*.1;
  cur2.style.left=tx-18+'px';cur2.style.top=ty-18+'px';
  requestAnimationFrame(t);
})();
document.querySelectorAll('a,.mbtn,.mbar').forEach(el=>{
  el.addEventListener('mouseenter',()=>{
    cur.style.transform='scale(2)';cur.style.background='#ff6060';
    cur2.style.transform='scale(1.3)';cur2.style.borderColor='rgba(255,60,60,.5)';
  });
  el.addEventListener('mouseleave',()=>{
    cur.style.transform='scale(1)';cur.style.background='#ff1a1a';
    cur2.style.transform='scale(1)';cur2.style.borderColor='rgba(255,26,26,.35)';
  });
});

const tracks=[
  {title:'Phonk Drive',  artist:'Dark Phonk',   src:'https://cdn.pixabay.com/audio/2023/03/13/audio_8a17891d66.mp3'},
  {title:'Red Night',    artist:'Anime Lofi',    src:'https://cdn.pixabay.com/audio/2022/10/31/audio_946b0b0cc5.mp3'},
  {title:'Slowed Vibes', artist:'K1llez Mix',    src:'https://cdn.pixabay.com/audio/2023/10/20/audio_54b1e3a2d5.mp3'},
];
let cur_t=0, playing=false;
const aud=document.getElementById('aud');
const playbtn=document.getElementById('playbtn');
const mviz=document.getElementById('mviz');
const msong=document.getElementById('msong');
const martist=document.getElementById('martist');
const mprogfill=document.getElementById('mprogfill');

function loadTrack(i){
  cur_t=(i+tracks.length)%tracks.length;
  aud.src=tracks[cur_t].src;
  msong.textContent=tracks[cur_t].title;
  martist.textContent=tracks[cur_t].artist;
  mprogfill.style.width='0%';
  if(playing){aud.play().catch(()=>{})}
}

function togglePlay(){
  if(playing){
    aud.pause();playing=false;
    playbtn.textContent='▶';
    mviz.classList.add('paused');
  } else {
    aud.volume=.4;
    aud.play().catch(()=>{});
    playing=true;
    playbtn.textContent='⏸';
    mviz.classList.remove('paused');
  }
}
function prevTrack(){loadTrack(cur_t-1)}
function nextTrack(){loadTrack(cur_t+1)}
function seekTrack(e){
  if(!aud.duration)return;
  const r=document.getElementById('mprog').getBoundingClientRect();
  aud.currentTime=((e.clientX-r.left)/r.width)*aud.duration;
}

aud.addEventListener('timeupdate',()=>{
  if(aud.duration) mprogfill.style.width=(aud.currentTime/aud.duration*100)+'%';
});
aud.addEventListener('ended',()=>nextTrack());

// Load first track
loadTrack(0);

// Auto-play on first interaction
document.addEventListener('click',function go(){
  if(!playing)togglePlay();
  document.removeEventListener('click',go);
},{once:true,capture:true});

/* ═══════════════════════════════
   RIPPLE
 */
document.querySelectorAll('.lcard').forEach(c=>{
  c.addEventListener('click',e=>{
    const r=c.getBoundingClientRect();
    const sz=Math.max(r.width,r.height);
    const d=document.createElement('span');
    d.style.cssText=`position:absolute;width:${sz}px;height:${sz}px;
      left:${e.clientX-r.left-sz/2}px;top:${e.clientY-r.top-sz/2}px;
      background:rgba(255,26,26,0.15);border-radius:50%;
      transform:scale(0);animation:rip .5s ease-out forwards;pointer-events:none;z-index:0`;
    c.appendChild(d);setTimeout(()=>d.remove(),520);
  });
});
const s=document.createElement('style');
s.textContent='@keyframes rip{to{transform:scale(2.5);opacity:0}}';
document.head.appendChild(s);
</script>
</body>
</html>
