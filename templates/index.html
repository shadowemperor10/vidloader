<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#05050a;
      --text:#f0eaea;
      --sub:#907070;
      --r:16px;
    }
    html,body{width:100%;min-height:100vh;overflow-x:hidden}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);cursor:none}

    /* CURSOR */
    #cur{width:10px;height:10px;background:#ff2020;border-radius:50%;position:fixed;pointer-events:none;z-index:9999;box-shadow:0 0 14px #ff2020,0 0 28px rgba(255,32,32,.5);transition:transform .1s;mix-blend-mode:screen}
    #cur2{width:32px;height:32px;border:1.5px solid rgba(255,32,32,.3);border-radius:50%;position:fixed;pointer-events:none;z-index:9998;transition:all .2s ease}

    /* BG */
    #bg{position:fixed;inset:0;z-index:0;pointer-events:none}

    /* MUSIC BAR */
    .mbar{position:fixed;bottom:0;left:0;right:0;z-index:300;background:rgba(5,0,0,.94);backdrop-filter:blur(30px);border-top:1px solid rgba(255,30,30,.15);padding:10px 16px;display:flex;align-items:center;gap:12px}
    .mcover{width:42px;height:42px;border-radius:10px;flex-shrink:0;background:linear-gradient(135deg,#2a0000,#150000);border:1px solid rgba(255,30,30,.25);display:flex;align-items:center;justify-content:center;font-size:20px;position:relative;overflow:hidden}
    .mcover::after{content:'';position:absolute;inset:0;background:conic-gradient(rgba(255,30,30,.25),transparent,rgba(255,30,30,.25));animation:cspin 3s linear infinite}
    @keyframes cspin{to{transform:rotate(360deg)}}
    .minfo{flex:1;min-width:0}
    .msong{font-size:12px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .martist{font-size:10px;color:var(--sub);margin-top:2px}
    .mprog{height:3px;background:rgba(255,255,255,.05);border-radius:99px;margin-top:7px;cursor:pointer}
    .mprogfill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#cc0000,#ff4040);transition:width .8s linear}
    .mbtns{display:flex;align-items:center;gap:8px;flex-shrink:0}
    .mbtn{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,30,30,.2);background:rgba(255,30,30,.06);color:var(--text);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
    .mbtn:hover{background:rgba(255,30,30,.2);box-shadow:0 0 14px rgba(255,30,30,.4);transform:scale(1.08)}
    .mbtn.play{width:40px;height:40px;font-size:17px;background:linear-gradient(135deg,#aa0000,#ff2020);border:none;box-shadow:0 0 18px rgba(255,30,30,.5)}
    .mbtn.play:hover{box-shadow:0 0 28px rgba(255,30,30,.7)}
    .mviz{display:flex;align-items:flex-end;gap:2px;height:16px;flex-shrink:0}
    .mviz span{width:3px;background:#ff2020;border-radius:2px;animation:vbar .65s ease-in-out infinite;box-shadow:0 0 5px rgba(255,32,32,.5)}
    .mviz span:nth-child(2){animation-delay:.1s}.mviz span:nth-child(3){animation-delay:.2s}.mviz span:nth-child(4){animation-delay:.3s}.mviz span:nth-child(5){animation-delay:.15s}
    .mviz.paused span{animation-play-state:paused;height:3px!important}
    @keyframes vbar{0%,100%{height:3px}50%{height:14px}}

    /* PAGE */
    .page{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:52px 16px 110px}

    /* PROFILE */
    .profile{text-align:center;margin-bottom:32px;animation:fup .8s ease both}
    .av-wrap{display:inline-block;position:relative;margin-bottom:18px}
    .av-ring{width:108px;height:108px;border-radius:50%;padding:3px;background:conic-gradient(from 0deg,#ff2020,#550000,#ff2020,#880000,#ff2020);animation:rspin 5s linear infinite}
    @keyframes rspin{to{filter:hue-rotate(30deg) drop-shadow(0 0 16px rgba(255,32,32,.7))}}
    .av-inner{width:100%;height:100%;border-radius:50%;background:#0a0000;overflow:hidden;display:flex;align-items:center;justify-content:center}
    .av-inner img{width:100%;height:100%;object-fit:cover}
    .av-glow{position:absolute;inset:-14px;border-radius:50%;z-index:-1;background:radial-gradient(circle,rgba(255,32,32,.45) 0%,transparent 65%);animation:pglow 2.5s ease-in-out infinite}
    @keyframes pglow{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.14)}}
    .pname{font-size:28px;font-weight:900;letter-spacing:-.5px;background:linear-gradient(90deg,#ff6060,#ff2020,#aa0000,#ff4040,#ff6060);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:tflow 4s linear infinite;margin-bottom:5px}
    @keyframes tflow{0%{background-position:0% 50%}100%{background-position:300% 50%}}
    .pbio{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--sub);font-weight:700}
    .sstrip{display:flex;justify-content:center;gap:7px;margin-top:14px}
    .sstrip a{width:30px;height:30px;border-radius:50%;background:rgba(255,32,32,.08);border:1px solid rgba(255,32,32,.2);display:flex;align-items:center;justify-content:center;font-size:13px;text-decoration:none;transition:all .22s cubic-bezier(.34,1.56,.64,1)}
    .sstrip a:hover{background:rgba(255,32,32,.22);border-color:rgba(255,32,32,.6);transform:translateY(-4px) scale(1.15);box-shadow:0 6px 18px rgba(255,32,32,.4)}

    /* DIVIDER */

    @keyframes dflo{0%{background-position:0%}100%{background-position:200%}}

    /* CARDS */
    .links{display:flex;flex-direction:column;gap:11px}
    .lcard{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r);text-decoration:none;color:var(--text);position:relative;overflow:hidden;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s;animation:fup .6s ease both}
    @keyframes fup{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    .lcard:nth-child(1){animation-delay:.08s}.lcard:nth-child(2){animation-delay:.14s}.lcard:nth-child(3){animation-delay:.2s}.lcard:nth-child(4){animation-delay:.26s}.lcard:nth-child(5){animation-delay:.32s}

    /* glass card with visible border */
    .lcard{
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.10);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
    }
    /* shimmer */
    .lcard::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);transition:left .4s ease}
    .lcard:hover::before{left:100%}
    /* top color line */
    .lcard::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--acc);opacity:0;transition:opacity .25s;border-radius:var(--r) var(--r) 0 0}
    .lcard:hover::after{opacity:1}
    .lcard:hover{transform:translateY(-4px) scale(1.008)}

    /* platform colors */
    .yt {--acc:linear-gradient(90deg,#ff0000,#ff7070);border-color:rgba(255,0,0,.25)!important}
    .tt {--acc:linear-gradient(90deg,#ee1d52,#69c9d0);border-color:rgba(238,29,82,.22)!important}

    .licon{width:46px;height:46px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}

    .foot strong{background:linear-gradient(90deg,#ff2020,#aa0000);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:900}

    @media(max-width:480px){.page{padding:44px 12px 108px}.mbar{padding:8px 12px}}
  </style>
</head>

<script>
/* ═══ GENERATIVE ART BG (abstract like the Pinterest video) ═══ */
(function(){
  const cv=document.getElementById('bg');
  const cx=cv.getContext('2d');
  let W,H,nodes=[],t=0;

  function resize(){
    W=cv.width=innerWidth;
    H=cv.height=innerHeight;
    nodes=[];
    const n=Math.min(80,Math.floor(W*H/9000));
    for(let i=0;i<n;i++) nodes.push({
      x:Math.random()*W, y:Math.random()*H,
      vx:(Math.random()-.5)*.35, vy:(Math.random()-.5)*.35,
      r:Math.random()*2+.8,
      hue:Math.random()<.7?0:340,
      sat:Math.random()*40+60,
      phase:Math.random()*Math.PI*2,
    });
  }

  function drawBlobs(){
    const blobDefs=[
      {x:W*.12,y:H*.18,r:W*.3, c:'rgba(200,0,0,'},
      {x:W*.82,y:H*.3, r:W*.26,c:'rgba(160,0,0,'},
      {x:W*.45,y:H*.72,r:W*.34,c:'rgba(180,0,20,'},
      {x:W*.08,y:H*.8, r:W*.22,c:'rgba(140,0,0,'},
      {x:W*.88,y:H*.78,r:W*.24,c:'rgba(170,0,30,'},
    ];
    blobDefs.forEach((b,i)=>{
      const pulse=.9+.1*Math.sin(t*.4+i);
      const ox=Math.sin(t*.3+i)*W*.04;
      const oy=Math.cos(t*.25+i)*H*.04;
      const r=b.r*pulse;
      const x=b.x+ox, y=b.y+oy;
      const g=cx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,b.c+'0.22)');
      g.addColorStop(.5,b.c+'0.08)');
      g.addColorStop(1,b.c+'0)');
      cx.save();
      cx.beginPath();
      for(let a=0;a<=Math.PI*2;a+=.15){
        const w=1+.14*Math.sin(t*.6+a*3.7+i);
        const rx=r*w, ry=r*(2-w)*.5;
        const px=x+Math.cos(a)*rx, py=y+Math.sin(a)*ry;
        a===0?cx.moveTo(px,py):cx.lineTo(px,py);
      }
      cx.closePath();
      cx.fillStyle=g;
      cx.fill();
      cx.restore();
    });
  }

  function drawLines(){
    cx.save();
    cx.lineWidth=.7;
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const dx=nodes[i].x-nodes[j].x;
        const dy=nodes[i].y-nodes[j].y;
        const dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<120){
          const alpha=(1-dist/120)*0.2;
          cx.strokeStyle=`rgba(255,30,30,${alpha})`;
          cx.beginPath();
          cx.moveTo(nodes[i].x,nodes[i].y);
          cx.lineTo(nodes[j].x,nodes[j].y);
          cx.stroke();
        }
      }
    }
    cx.restore();
  }

  function drawNodes(){
    nodes.forEach(n=>{
      n.x+=n.vx; n.y+=n.vy;
      if(n.x<0||n.x>W)n.vx*=-1;
      if(n.y<0||n.y>H)n.vy*=-1;
      const glow=cx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r*4);
      glow.addColorStop(0,`hsla(${n.hue},${n.sat}%,55%,.9)`);
      glow.addColorStop(1,`hsla(${n.hue},${n.sat}%,40%,0)`);
      cx.beginPath();
      cx.arc(n.x,n.y,n.r,0,Math.PI*2);
      cx.fillStyle=glow;
      cx.shadowColor=`hsl(${n.hue},80%,50%)`;
      cx.shadowBlur=8;
      cx.fill();
      cx.shadowBlur=0;
    });
  }

  function drawScanlines(){
    cx.save();
    for(let y=0;y<H;y+=3){
      cx.fillStyle='rgba(0,0,0,0.04)';
      cx.fillRect(0,y,W,1);
    }
    cx.restore();
  }

  function drawVignette(){
    const g=cx.createRadialGradient(W/2,H/2,H*.05,W/2,H/2,H*.85);
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(1,'rgba(0,0,0,.78)');
    cx.fillStyle=g;cx.fillRect(0,0,W,H);
  }

  function loop(){
    t=Date.now()*.001;
    cx.fillStyle='#05050a';cx.fillRect(0,0,W,H);
    drawBlobs();
    drawLines();
    drawNodes();
    drawScanlines();
    drawVignette();
    requestAnimationFrame(loop);
  }
  resize();loop();
  addEventListener('resize',resize);
})();

const cur2=document.getElementById('cur2');

/* ═══ MUSIC ═══ */
const tracks=[
  {title:'Phonk Ride',   artist:'Dark Energy',  src:'https://cdn.pixabay.com/audio/2023/03/13/audio_8a17891d66.mp3'},
  {title:'Red Aura',     artist:'Anime Lofi',   src:'https://cdn.pixabay.com/audio/2022/10/31/audio_946b0b0cc5.mp3'},
  {title:'Slowed Vibes', artist:'K1llez Mix',   src:'https://cdn.pixabay.com/audio/2023/10/20/audio_54b1e3a2d5.mp3'},
];
let ci=0,playing=false;
const aud=document.getElementById('aud');
const playbtn=document.getElementById('playbtn');
const mviz=document.getElementById('mviz');
function load(i){
  ci=(i+tracks.length)%tracks.length;
  aud.src=tracks[ci].src;
  document.getElementById('msong').textContent=tracks[ci].title;
  document.getElementById('martist').textContent=tracks[ci].artist;
  document.getElementById('mprogfill').style.width='0%';
  if(playing)aud.play().catch(()=>{});
}
function toggle(){
  if(playing){aud.pause();playing=false;playbtn.textContent='▶';mviz.classList.add('paused')}
  else{aud.volume=.38;aud.play().catch(()=>{});playing=true;playbtn.textContent='⏸';mviz.classList.remove('paused')}
}
function prev(){load(ci-1)}
function next(){load(ci+1)}
function seek(e){if(!aud.duration)return;const r=document.getElementById('mprog').getBoundingClientRect();aud.currentTime=((e.clientX-r.left)/r.width)*aud.duration}
aud.addEventListener('timeupdate',()=>{if(aud.duration)document.getElementById('mprogfill').style.width=(aud.currentTime/aud.duration*100)+'%'});
aud.addEventListener('ended',()=>next());
load(0);
document.addEventListener('click',function go(){if(!playing)toggle();document.removeEventListener('click',go)},{once:true,capture:true});

/* ═══ RIPPLE ═══ */
const rs=document.createElement('style');rs.textContent='@keyframes rip{to{transform:scale(2.8);opacity:0}}';document.head.appendChild(rs);
document.querySelectorAll('.lcard').forEach(c=>{
  c.addEventListener('click',e=>{
    const r=c.getBoundingClientRect(),sz=Math.max(r.width,r.height);
    const d=document.createElement('span');
    d.style.cssText=`position:absolute;width:${sz}px;height:${sz}px;left:${e.clientX-r.left-sz/2}px;top:${e.clientY-r.top-sz/2}px;background:rgba(255,30,30,.12);border-radius:50%;transform:scale(0);animation:rip .5s ease-out forwards;pointer-events:none;z-index:0`;
    c.appendChild(d);setTimeout(()=>d.remove(),520);
  });
});
</script>
